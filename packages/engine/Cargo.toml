[package]
name = "uoplan-engine"
version = "0.1.0"
edition = "2021"
description = "Schedule-generation engine for uoplan, compiled to WASM and shared by the web app and the OG-image worker"
license = "MIT"
repository = "https://github.com/uoplan/uoplan"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
prost = "0.14"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
# Off by default so release WASM doesn't pay for the panic hook (~3 KB). The dev
# WASM build re-enables it (see scripts/build-engine-wasm.sh) for readable panics.
default = []

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "generation"
harness = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[lints.clippy]
pedantic = "warn"
