[package]
name = "uoplan-engine"
version = "0.1.0"
edition = "2021"
description = "Schedule-generation engine for uoplan, compiled to WASM and shared by the web app and the OG-image worker"
license = "MIT"
repository = "https://github.com/uoplan/uoplan"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
prost = "0.14"
console_error_panic_hook = { version = "0.1", optional = true }

# Android-only: JNI binding for the native engine (see src/jni_android.rs). Target-
# gated so it is never pulled into the WASM or iOS (apple) builds.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[features]
# Off by default so release WASM doesn't pay for the panic hook (~3 KB). The dev
# WASM build re-enables it (see scripts/build-engine-wasm.sh) for readable panics.
default = []

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "generation"
harness = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
# Recent nightly rustc/LLVM emit post-MVP wasm features (multiple tables via
# reference-types, bulk-memory, ...). wasm-pack's bundled wasm-opt rejects them
# unless enabled, which broke CI with "Only 1 table definition allowed in MVP".
wasm-opt = [
  "-Oz",
  "--enable-reference-types",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-multivalue",
]

[lints.clippy]
pedantic = "warn"
