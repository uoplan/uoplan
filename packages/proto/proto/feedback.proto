syntax = "proto3";

package feedback;

// Combined uOttawa course-evaluation ("S-Report") survey data for every scraped
// term. Every repeated value lives in a dictionary referenced by index, so no
// string (or repeated structure) is ever duplicated:
//   * question texts and answer-option labels -> `questions` / `option_sets`;
//   * the ordered list of questions a section was evaluated on -> `question_sets`
//     (only a handful of distinct sequences exist across the whole corpus);
//   * professor names -> `professors`;
//   * course codes -> the shared `indices.pb` course list (see `courses` below).
//
// There are two report eras in the source data:
//   * older reports expose the per-option Likert distribution, captured (flattened)
//     in `FeedbackSection.counts`; their per-question response total is the sum of
//     that question's counts, so `responses` is left empty for them;
//   * modern reports bake the distribution into a chart image, so only the
//     response count (and invited/`registered`) is available, `counts` is empty,
//     and `responses` is stored explicitly.
// Percentages are always derivable as `count / responses`, so they are not stored.
// The mean and standard deviation are intentionally NOT stored: for older reports
// they are recomputable from the distribution, and the raw values remain in the
// committed `data/feedback.<termId>.json` source if ever needed.

// An ordered Likert scale: the answer labels in their display order, e.g.
// ["strongly agree", "agree", "disagree", "strongly disagree"].
message FeedbackOptionSet {
  repeated string labels = 1;
}

// A distinct survey question. `option_set` indexes `FeedbackData.option_sets` and
// is set for every question whose per-option distribution has been observed (i.e.
// any question that ever carried counts); purely chart-only questions leave it
// unset.
message FeedbackQuestion {
  string text = 1;
  optional uint32 option_set = 2;
}

// An ordered list of questions (indices into `FeedbackData.questions`) that a
// section was evaluated on. Only a handful of distinct sequences occur across the
// whole corpus, so each section references one of these instead of repeating the
// question indices inline.
message FeedbackQuestionSet {
  repeated uint32 questions = 1;
}

// One section's evaluations within a term, stored column-wise. `question_set`
// indexes `FeedbackData.question_sets`; `responses` and `registered` are packed
// arrays aligned with that question set's questions. `registered` is empty for
// older reports (invited counts unavailable) and aligned for modern reports.
// `responses` is the reverse: empty for older reports (recompute each entry as the
// sum of that question's `counts` slice) and aligned for modern reports. `counts`
// holds the per-option distribution for older reports, flattened across questions
// in order and empty for modern reports; the slice for question i has the length
// of that question's option set
// (`FeedbackData.option_sets[questions[question_set][i].option_set]`).
message FeedbackSection {
  string section = 1;
  uint32 professor = 2;
  uint32 question_set = 3;
  repeated uint32 responses = 4;
  repeated uint32 registered = 5;
  repeated uint32 counts = 6;
}

// All evaluated sections of one course within one term.
//
// `course` identifies the course code without storing the string: if
// `course < FeedbackData.indices_course_count` it indexes the shared
// `indices.pb` course list; otherwise `course - indices_course_count` indexes
// `FeedbackData.extra_courses` (historical codes absent from `indices.pb`).
message FeedbackTermCourse {
  uint32 course = 1;
  repeated FeedbackSection sections = 2;
}

// One term's evaluations. Aggregating a course across its sections (sum `counts`
// and `responses`) yields the course-level term summary used by the dedicated
// feedback explore page.
message FeedbackTerm {
  uint32 term_id = 1;
  repeated FeedbackTermCourse courses = 2;
}

// Top-level combined dataset: dictionaries followed by the per-term tree.
message FeedbackData {
  repeated FeedbackOptionSet option_sets = 1;
  repeated FeedbackQuestion questions = 2;
  repeated string professors = 3;
  // Course codes not present in `indices.pb`, addressed by course indices >=
  // `indices_course_count`.
  repeated string extra_courses = 4;
  // Length of the `indices.pb` course list this file was built against; the
  // boundary between shared-index and `extra_courses` course references.
  uint32 indices_course_count = 5;
  repeated FeedbackTerm terms = 6;
  // Distinct ordered question sequences, referenced by `FeedbackSection.question_set`.
  repeated FeedbackQuestionSet question_sets = 7;
}
