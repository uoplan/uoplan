syntax = "proto3";

package scheduledata;

message CatalogueManifest {
  repeated uint32 years = 1 [packed = true];
}

message Indices {
  // Courses and programs are stored *columnar* (not as plain string arrays) to
  // shrink the asset; `fromProtoIndices` reconstructs the string arrays in their
  // original order (the load-bearing index space used by state/share-link
  // encoding). Old string fields are retired:
  reserved 1;  // was: repeated string courses
  reserved 2;  // was: repeated string programs
  // Discipline dictionary: distinct course subject prefixes (e.g. "CSI"), in
  // first-occurrence order over `courses`. Doubles as the dictionary for the
  // columnar course encoding and as the state-encoding discipline index space.
  repeated string disciplines = 3;
  // Per-course discipline: index into `disciplines`. The sentinel value
  // `disciplines.length` marks a literal-overflow course (see course_literal_*).
  repeated uint32 course_discipline = 4 [packed = true];
  // Per-course catalogue number, delta-encoded (zigzag) within each discipline
  // (course order is append-order, not sorted, so deltas can be negative).
  repeated sint32 course_number_delta = 5 [packed = true];
  // Sparse single-letter code suffixes (e.g. "ADM 6385I"): parallel arrays of
  // the course position and the suffix character code.
  repeated uint32 course_suffix_pos = 6 [packed = true];
  repeated uint32 course_suffix_char = 7 [packed = true];
  // Front-coded programs: shared-prefix length with the previous program, plus
  // the remaining suffix (program slugs share long path-like prefixes).
  repeated uint32 program_prefix_len = 8 [packed = true];
  repeated string program_suffix = 9;
  // Sparse literal overflow for any course code that doesn't fit the
  // "<DISC> <number><suffix?>" shape (none in current data; forward-compat).
  repeated uint32 course_literal_pos = 10 [packed = true];
  repeated string course_literal = 11;
}

// The canonical professor registry: one entry per real person, collapsing the
// name/diacritic/middle-name variants the same professor accumulates across
// RateMyProfessors, grades, schedules and feedback. Every other dataset
// references a professor by his INDEX into `ProfessorsData.professors` rather
// than repeating a name string. Built by the scraper from the committed
// `data/professors.json` (see @uoplan/core professorIdentity / the scraper
// buildRegistry).
message ProfessorsData {
  repeated ProfessorEntry professors = 1;
}

message ProfessorEntry {
  // field 1 (slug) removed: the URL-safe public id is `slugifyProfessor(name)`,
  // recomputed at decode time, so it is no longer stored (saves a high-entropy
  // string per professor). Collision-disambiguation suffixes are NOT preserved.
  reserved 1;
  reserved "slug";
  // Canonical display name: the fullest variant (keeps accents and middle names).
  string name = 2;
  // Every RateMyProfessors legacyId merged into this person (combined reviews).
  repeated uint32 legacy_ids = 3 [packed = true];
  // Response-weighted average rating across all merged RMP profiles, when rated.
  optional double rating = 4;
  optional uint32 num_ratings = 5;
  // Other observed spellings of this person's name (for search), excluding `name`.
  repeated string aliases = 6;
}

message TermsData {
  repeated Term terms = 1;
}

message Term {
  uint32 term_id = 1;
  string name = 2;
}

message RateMyProfessorsData {
  uint32 result_count = 1;
  repeated Professor professors = 2;
}

message Professor {
  // field 1 (id) removed: the opaque RateMyProfessors GraphQL node id is unused at
  // runtime (the ratings map keys on `legacy_id`), so it is no longer stored.
  reserved 1;
  reserved "id";
  optional uint32 legacy_id = 2;
  string name = 3;
  optional double rating = 4;
  optional uint32 num_ratings = 5;
}

message Discipline {
  string code = 1;
  string name = 2;
  string name_fr = 3;
}

message DisciplinesData {
  repeated Discipline disciplines = 1;
}

message Catalogue {
  repeated string course_codes = 1;
  repeated Course courses = 2;
  repeated Program programs = 3;
  // Program-requirement code strings not present in `course_codes` (e.g.
  // cross-year references). `ProgramRequirement.code_ref` values past
  // `course_codes.length` index into this list. See ProgramRequirement.
  repeated string extra_codes = 4;
}

message Course {
  // 0-based index into `Catalogue.course_codes`.
  uint32 code = 1;
  string title = 2;
  double credits = 3;
  optional string component = 4;
  // 0-based indices into `Catalogue.course_codes` (alternate codes for the
  // same course). Packed so the common 0-alias case costs nothing.
  repeated uint32 aliases = 5 [packed = true];
  bool has_prereq_text = 6;
  optional CoursePrereqNode prerequisites = 8;
}

enum CoursePrereqNodeType {
  COURSE_PREREQ_NODE_TYPE_UNSPECIFIED = 0;
  COURSE_PREREQ_NODE_TYPE_COURSE = 1;
  COURSE_PREREQ_NODE_TYPE_OR_GROUP = 2;
  COURSE_PREREQ_NODE_TYPE_AND_GROUP = 3;
  COURSE_PREREQ_NODE_TYPE_NON_COURSE = 4;
}

// Coarse classification of an opaque `non_course` prerequisite (one with no
// credit pool), so consumers can decide whether it blocks scheduling.
enum CoursePrereqKind {
  COURSE_PREREQ_KIND_UNSPECIFIED = 0;
  COURSE_PREREQ_KIND_PERMISSION = 1;
  COURSE_PREREQ_KIND_AUDITION = 2;
  COURSE_PREREQ_KIND_LANGUAGE = 3;
  COURSE_PREREQ_KIND_EQUIVALENT = 4;
  COURSE_PREREQ_KIND_HIGHSCHOOL = 5;
  COURSE_PREREQ_KIND_STANDING = 6;
  COURSE_PREREQ_KIND_TOPIC = 7;
  COURSE_PREREQ_KIND_COURSEWORK = 8;
  COURSE_PREREQ_KIND_KNOWLEDGE = 9;
  COURSE_PREREQ_KIND_RECOMMENDED = 10;
}

message CoursePrereqDisciplineLevel {
  string discipline = 1;
  repeated uint32 levels = 2 [packed = true];
}

message CoursePrereqNode {
  CoursePrereqNodeType type = 1;
  optional string code = 2;
  optional double credits = 3;
  repeated string disciplines = 4;
  repeated uint32 levels = 5 [packed = true];
  repeated CoursePrereqDisciplineLevel discipline_levels = 6;
  repeated string programs = 7;
  repeated CoursePrereqNode children = 8;
  optional string text = 9;
  optional CoursePrereqKind kind = 10;
}

enum RequirementType {
  REQUIREMENT_TYPE_UNSPECIFIED = 0;
  REQUIREMENT_TYPE_COURSE = 1;
  REQUIREMENT_TYPE_ELECTIVE = 2;
  REQUIREMENT_TYPE_GROUP = 3;
  REQUIREMENT_TYPE_PICK = 4;
  REQUIREMENT_TYPE_OPTIONS_GROUP = 5;
  REQUIREMENT_TYPE_DISCIPLINE_ELECTIVE = 6;
  REQUIREMENT_TYPE_FREE_ELECTIVE = 7;
  REQUIREMENT_TYPE_NON_DISCIPLINE_ELECTIVE = 8;
  REQUIREMENT_TYPE_FACULTY_ELECTIVE = 9;
  REQUIREMENT_TYPE_SECTION = 10;
  REQUIREMENT_TYPE_AND = 11;
  REQUIREMENT_TYPE_OR_GROUP = 12;
  REQUIREMENT_TYPE_OR_COURSE = 13;
}

message DisciplineLevel {
  string discipline = 1;
  repeated uint32 levels = 2 [packed = true];
}

message ProgramRequirement {
  reserved 3, 4;
  reserved "code", "credits";
  RequirementType type = 1;
  optional string title = 2;
  repeated DisciplineLevel discipline_levels = 5;
  repeated string excluded_disciplines = 6;
  optional string faculty = 7;
  optional bool indented = 8;
  repeated ProgramRequirement options = 9;
  repeated uint32 levels = 10 [packed = true];
  // 1-based reference to a course code. 0 = absent. Values in
  // 1..=Catalogue.course_codes.length index `course_codes` (ref-1, 0-based);
  // larger values index `Catalogue.extra_codes` (ref - course_codes.length - 1).
  optional uint32 code_ref = 11;
  // Credits scaled ×4 (all catalogue credits are exact quarter-multiples).
  // Decoded as credits_x4 / 4.
  optional uint32 credits_x4 = 12;
}

message Program {
  string title = 1;
  string program_key = 2;
  repeated ProgramRequirement requirements = 3;
}

enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  DAY_OF_WEEK_MO = 1;
  DAY_OF_WEEK_TU = 2;
  DAY_OF_WEEK_WE = 3;
  DAY_OF_WEEK_TH = 4;
  DAY_OF_WEEK_FR = 5;
  DAY_OF_WEEK_SA = 6;
  DAY_OF_WEEK_SU = 7;
}

message MeetingTime {
  DayOfWeek day = 1;
  uint32 start_minutes = 2;
  uint32 end_minutes = 3;
  bool virtual = 4;
  optional string instructor = 5;
  // field 6 reserved: per-meeting date ranges were inlined as a MeetingDateRange
  // submessage; they are now dictionary-encoded via `meeting_dates_ref` (the same
  // (start,end) range repeats across most meetings of a term).
  reserved 6;
  reserved "meeting_dates";
  // 1-based index into `ProfessorsData.professors`; absent when unassigned
  // ("Staff") or unresolved. 1-based so a present value is never the default 0.
  optional uint32 professor_ref = 7;
  // 1-based index into `SchedulesData.meeting_date_ranges`; absent/0 when the
  // meeting has no known date range.
  optional uint32 meeting_dates_ref = 8;
}

message MeetingDateRange {
  uint32 start_yyyymmdd = 1;
  uint32 end_yyyymmdd = 2;
}

enum SectionStatus {
  SECTION_STATUS_UNSPECIFIED = 0;
  SECTION_STATUS_OPEN = 1;
  SECTION_STATUS_CLOSED = 2;
}

// A build-time guess of who may teach a section that has no assigned
// instructor (every meeting time is "Staff"/blank). Informational only: these
// names are NEVER fed into grade lookups, professor-rating filters, or the
// schedule-generation engine.
message PredictedInstructor {
  string name = 1;
  // RateMyProfessors legacy id, resolved from grades.json when the name can be
  // matched. Absent for schedule-only candidates with no grades record.
  optional uint32 legacy_id = 2;
  // 1-based index into `ProfessorsData.professors` (0 = unresolved).
  optional uint32 professor_ref = 3;
}

message ComponentSection {
  string section = 1;
  optional string section_code = 2;
  optional string component = 3;
  optional string session = 4;
  repeated MeetingTime times = 5;
  // fields 6 and 7 reserved (instructors/meeting_dates moved into MeetingTime)
  SectionStatus status = 8;
  // field 9 reserved: per-section grade distribution is no longer embedded; it
  // is reconstructed at runtime from grades.pb (see @uoplan/core gradeLookup).
  reserved 9;
  reserved "distribution";
  // Populated ONLY when the section has no known instructor; the build-time
  // guess of who may teach it. Empty for sections with an assigned instructor.
  repeated PredictedInstructor predicted_instructors = 10;
}

message ComponentSectionList {
  repeated ComponentSection items = 1;
}

message CourseSchedule {
  // 0-based index into `SchedulesData.course_codes`.
  uint32 course = 1;
  optional string title = 2;
  string time_zone = 3;
  map<string, ComponentSectionList> components = 4;
}

message SchedulesData {
  uint32 term_id = 1;
  repeated string course_codes = 2;
  optional uint32 total_courses = 3;
  optional uint32 total_with_schedules = 4;
  repeated CourseSchedule schedules = 5;
  // Dictionary of distinct meeting date ranges for this term, referenced
  // (1-based) by `MeetingTime.meeting_dates_ref`. Most meetings of a term share
  // a handful of ranges, so this avoids a per-meeting MeetingDateRange submessage.
  repeated MeetingDateRange meeting_date_ranges = 6;
}

// Grade data is stored column-wise per course: every `repeated` field below is a
// parallel array where index `i` describes one (professor, term, section)
// offering of the course. This avoids a per-offering submessage and a per-cell
// field tag, and lets the professor name be shared via a dictionary.
message GradesData {
  repeated CourseGradeEntry courses = 1;
  // Dictionary of distinct offering professor display names, referenced 0-based
  // by `CourseGradeEntry.name_refs`. The same professor appears across many
  // offerings, so the names are deduplicated here.
  repeated string professor_names = 2;
}

// One course's grade offerings, stored as parallel columns. All `repeated`
// fields have the same length N (the number of offerings); index `i` is one
// offering. `distributions` is the only exception: it is N*18 values, row-major,
// so offering `i` occupies `distributions[i*18 .. i*18+18]`.
message CourseGradeEntry {
  string code = 1;
  // 0-based index into `GradesData.professor_names`.
  repeated uint32 name_refs = 2 [packed = true];
  repeated uint32 term_ids = 3 [packed = true];
  // 1-based index into `ProfessorsData.professors` (0 = unresolved).
  repeated uint32 professor_refs = 4 [packed = true];
  // RateMyProfessors legacy id (0 = none).
  repeated uint32 legacy_ids = 5 [packed = true];
  // Per-offering section code ("" = none).
  repeated string sections = 6;
  // N*18 grade counts, row-major, in the canonical letter order:
  // A+, A, A-, B+, B, C+, C, D+, D, E, F, DR, EIN, NS, NC, ABS, P, S.
  repeated uint32 distributions = 7 [packed = true];
}
