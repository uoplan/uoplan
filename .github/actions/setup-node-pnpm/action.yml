name: Setup Node + pnpm
description: Checkout is assumed done by the caller. Sets up pnpm, Node 24 (with pnpm cache), and installs dependencies frozen.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Setup Node 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
