name: Native Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        default: all
        options:
          - ios
          - android
          - all
      profile:
        description: "EAS build profile"
        type: choice
        default: production
        options:
          - production
          - preview
      submit:
        description: "Submit latest completed production build to TestFlight / Play internal track"
        type: boolean
        default: true
  # Reusable entry point so release automation (release-please) can trigger a
  # production build + store submission on every new app release.
  workflow_call:
    inputs:
      platform:
        description: "Platform to build (ios | android | all)"
        type: string
        default: all
      profile:
        description: "EAS build profile"
        type: string
        default: production
      submit:
        description: "Submit the build to TestFlight / Play internal track"
        type: boolean
        default: true
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: native-deploy-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  # Resolve the platform matrix so each platform runs on the right OS:
  # Android builds on Linux, iOS builds on macOS.
  prepare:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Build matrix from selected platform
        id: matrix
        shell: bash
        run: |
          case "${{ inputs.platform }}" in
            ios)
              echo 'value={"include":[{"platform":"ios","runner":"macos-latest"}]}' >> "$GITHUB_OUTPUT" ;;
            android)
              echo 'value={"include":[{"platform":"android","runner":"ubuntu-latest"}]}' >> "$GITHUB_OUTPUT" ;;
            *)
              echo 'value={"include":[{"platform":"android","runner":"ubuntu-latest"},{"platform":"ios","runner":"macos-latest"}]}' >> "$GITHUB_OUTPUT" ;;
          esac

  build-submit:
    name: ${{ matrix.platform }} (${{ inputs.profile }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # eas-cli authenticates with this token; no Expo username/password needed.
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PLATFORM: ${{ matrix.platform }}
      PROFILE: ${{ inputs.profile }}
      SHOULD_SUBMIT: ${{ inputs.submit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          # Matches the NDK the React Native Gradle plugin (Expo SDK) pins; also
          # used by cargo-ndk when the postinstall compiles the JNI engine .so.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          # `pnpm generate` (run by the EAS postinstall) compiles the protobufs.
          # The protoc npm package usually provides the binary, but install a
          # system protoc as a guaranteed fallback.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          else
            brew list protobuf >/dev/null 2>&1 || brew install protobuf
          fi

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on the runner (no EAS cloud)
        id: build
        working-directory: apps/native
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SHOULD_SUBMIT" == "true" && "$PROFILE" != "production" ]]; then
            echo "::error::Store submission is only supported for the production profile. Re-run with submit=false for preview builds."
            exit 1
          fi

          ext=aab
          if [[ "$PLATFORM" == "ios" ]]; then
            ext=ipa
          fi
          out="${RUNNER_TEMP}/uoplan-${PLATFORM}.${ext}"

          # --local runs the entire build on this GitHub runner (zero EAS Build
          # cloud minutes); signing credentials are still fetched from EAS.
          eas build \
            --local \
            --non-interactive \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --output "$out"

          echo "artifact=$out" >> "$GITHUB_OUTPUT"

      - name: Submit to the store (eas submit)
        if: ${{ inputs.submit }}
        working-directory: apps/native
        shell: bash
        run: |
          set -euo pipefail
          eas submit \
            --non-interactive \
            --platform "$PLATFORM" \
            --profile production \
            --path "${{ steps.build.outputs.artifact }}"
