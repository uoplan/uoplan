name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apps/cli/**"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - "apps/cli/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup nightly Rust (engine WASM build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Run generator
        run: pnpm generate

      - name: Build engine WASM
        run: pnpm build:engine-wasm

      - name: Run Rust engine tests
        run: pnpm --filter @uoplan/engine test:rust

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check architecture guardrails
        run: pnpm check:arch

      - name: Check translations
        run: pnpm check:i18n

      - name: Run tests
        run: pnpm test

      - name: Run production build
        run: pnpm build
