name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      app_release_created: ${{ steps.release.outputs['.--release_created'] }}
      app_tag_name: ${{ steps.release.outputs['.--tag_name'] }}
      cli_release_created: ${{ steps.release.outputs['apps/cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['apps/cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cli-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' }}
    uses: ./.github/workflows/cli-release.yml
    with:
      tag: ${{ needs.release-please.outputs.cli_tag_name }}
    permissions:
      contents: write

  native-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.app_release_created == 'true' }}
    uses: ./.github/workflows/native-deploy.yml
    with:
      # iOS CI is fully implemented in native-deploy.yml but kept OFF the
      # automatic release trigger for now. Switch this to `all` (or `ios`) to
      # also build + submit iOS on every release; iOS can still be built
      # on-demand via the Native Deploy workflow_dispatch in the meantime.
      platform: android
      profile: production
      submit: true
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    permissions:
      contents: read
