name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # The root component (path ".", the "uoplan-monorepo" package whose version
      # the native app tracks) exposes UN-prefixed outputs (release_created /
      # tag_name). Only non-root paths (e.g. apps/cli) get the "<path>--" prefix.
      # Using ".--release_created" here previously always resolved to "" and the
      # native deploy was silently skipped even on a real root release.
      app_release_created: ${{ steps.release.outputs.release_created }}
      app_tag_name: ${{ steps.release.outputs.tag_name }}
      cli_release_created: ${{ steps.release.outputs['apps/cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['apps/cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cli-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' }}
    uses: ./.github/workflows/cli-release.yml
    with:
      tag: ${{ needs.release-please.outputs.cli_tag_name }}
    permissions:
      contents: write

  native-release:
    needs: release-please
    # The native app's version is the root "uoplan-monorepo" package version, so
    # deploy it whenever that root component is released — i.e. on every
    # release-please release PR merge that bumps the app (the normal case).
    if: ${{ needs.release-please.outputs.app_release_created == 'true' }}
    uses: ./.github/workflows/native-deploy.yml
    with:
      # Build + submit BOTH platforms on every app release: iOS → TestFlight,
      # Android → Play internal track. (Either can still be built on-demand via
      # the Native Deploy workflow_dispatch.)
      platform: all
      profile: production
      submit: true
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    permissions:
      contents: read
