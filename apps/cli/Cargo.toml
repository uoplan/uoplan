[package]
name = "uoplan"
version = "0.4.1"
edition = "2021"
description = "Course planner CLI for University of Ottawa students — search, enrol, and snipe course registrations via PeopleSoft"
license = "MIT"
repository = "https://github.com/uoplan/uoplan"
homepage = "https://uoplan.party"
keywords = ["uottawa", "course", "enrollment", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "uoplan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
  "cookies",
  "gzip",
  "rustls-tls",
  "json",
] }
scraper = "0.27"
thirtyfour = { version = "0.37", features = ["manager"] }
prost = "0.14"
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
regex = "1"
anyhow = "1"
thiserror = "2"
futures = "0.3"
url = "2"
cliclack = "0.5"
uv-keyring = "0.0.40"
self_update = { version = "0.42", default-features = false, features = [
  "rustls",
  "archive-tar",
  "archive-zip",
  "compression-flate2",
  "compression-zip-deflate",
] }
dirs = "5"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[lints.clippy]
pedantic = "warn"
