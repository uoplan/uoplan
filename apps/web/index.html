<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>uoPlan</title>
    <meta
      name="description"
      content="Free course planner and timetable generator for University of Ottawa (uOttawa) students. Map your degree, check prerequisites, and generate conflict-free timetables in seconds."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="uoPlan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body style="margin: 0; min-height: 100vh">
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong
      // colours. Mirrors the resolution logic in src/theme/themes.ts.
      (function () {
        try {
          var sel = localStorage.getItem("uoplan.theme") || "system";
          var base, id;
          if (sel === "dark" || sel === "light") {
            base = sel;
            id = sel;
          } else {
            base = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            id = base;
          }
          var el = document.documentElement;
          el.setAttribute("data-app-theme", id);
          el.setAttribute("data-mantine-color-scheme", base);
        } catch (e) {}
      })();
    </script>
    <noscript>
      <h1>uoPlan: uOttawa course planner and schedule generator</h1>
      <p>
        Free course planner and timetable generator for University of Ottawa students. Build
        conflict-free schedules, check prerequisites, explore course grades and professor ratings,
        and plan your degree.
      </p>
    </noscript>
    <div id="root" style="min-height: 100vh"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
