<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uoPlan</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1a20;
        --fg: #f4f3f7;
        --muted: #a09fa8;
        --accent: #8ec5ff;
        --border: #34323c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 280px;
        padding: 14px;
        font:
          13px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
      }
      button {
        display: block;
        width: 100%;
        margin: 0 0 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #25242c;
        color: var(--fg);
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      .accent {
        border-color: var(--accent);
        color: var(--accent);
      }
      #status {
        margin-top: 10px;
        padding: 8px 10px;
        min-height: 34px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #161519;
        color: var(--muted);
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>uoPlan</h1>
    <p class="sub">uoCampus dev tools</p>
    <button id="dump" class="accent">Dump page structure</button>
    <button id="grades">Load grade data</button>
    <button id="ping">Check log sink</button>
    <div id="status">Ready.</div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
