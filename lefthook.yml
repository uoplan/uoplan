pre-commit:
  commands:
    oxfmt:
      glob: "**/*.{cjs,cts,html,js,json,jsx,md,mjs,mts,ts,tsx,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern --check {staged_files}
    oxlint:
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}
    typecheck:
      glob: "**/*.{ts,tsx,mts,cts}"
      run: pnpm typecheck
    check-i18n:
      glob: "{**/locales/**/*.po,apps/web/src/**/*.{ts,tsx},apps/native/src/**/*.{ts,tsx}}"
      run: pnpm check:i18n
    fallow:
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      # health (complexity/CRAP) analysis is temporarily disabled — see CLAUDE.md.
      run: pnpm check:fallow
    cargo-clippy:
      glob: "apps/cli/**"
      run: cargo clippy --manifest-path apps/cli/Cargo.toml -- -D warnings

pre-push:
  commands:
    # Report-only Lighthouse audit of a production build (see scripts/lighthouse.mjs
    # + apps/web/lighthouserc.cjs). `|| true` keeps it advisory: low scores or an
    # audit hiccup never block the push. Skip ad-hoc with `git push --no-verify`.
    lighthouse:
      run: pnpm lighthouse || true
