pre-commit:
  commands:
    oxfmt:
      glob: "**/*.{cjs,cts,html,js,json,jsx,md,mjs,mts,ts,tsx,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern --check {staged_files}
    oxlint:
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm exec oxlint {staged_files}
    typecheck:
      glob: "**/*.{ts,tsx,mts,cts}"
      run: pnpm typecheck
    cargo-clippy:
      glob: "apps/cli/**"
      run: cargo clippy --manifest-path apps/cli/Cargo.toml -- -D warnings
